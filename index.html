<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>미니멀 가계부</title>
  <!-- Tailwind CSS CDN -->
  <script src="https://cdn.tailwindcss.com"></script>
  <style>
    /* 기본 스크롤바 숨김 및 모바일 최적화 스타일 */
    body {
      -webkit-tap-highlight-color: transparent;
    }
    .no-scrollbar::-webkit-scrollbar {
      display: none;
    }
    .no-scrollbar {
      -ms-overflow-style: none;
      scrollbar-width: none;
    }
  </style>
</head>
<body class="bg-gray-100 min-h-screen flex justify-center items-start sm:py-8 font-sans antialiased selection:bg-teal-500 selection:text-white">

  <!-- 메인 모바일 컨테이너 -->
  <div class="w-full max-w-md bg-gray-50 min-h-screen sm:min-h-[844px] sm:rounded-3xl shadow-2xl flex flex-col justify-between overflow-hidden relative border border-gray-200">
    
    <!-- HEADER -->
    <header class="bg-white border-b border-gray-200 px-5 py-4 flex items-center justify-between sticky top-0 z-10">
      <div class="flex items-center gap-2">
        <span class="text-2xl">💰</span>
        <h1 class="font-black text-xl text-gray-800 tracking-tight">가계부</h1>
      </div>
      <button onclick="goToStep(1)" class="text-xs bg-gray-100 hover:bg-gray-200 text-gray-600 px-3 py-1.5 rounded-full font-bold transition">
        오늘 달력
      </button>
    </header>

    <!-- MAIN CONTENT AREA -->
    <main class="flex-1 overflow-y-auto p-4 no-scrollbar">
      
      <!-- STEP 1: 달력 메인 화면 -->
      <section id="step1" class="space-y-4">
        <!-- 연/월 선택 및 월 총계 카드 -->
        <div class="bg-white p-5 rounded-2xl border border-gray-100 shadow-sm space-y-4">
          <div class="flex justify-between items-center">
            <button onclick="changeMonth(-1)" class="p-2 hover:bg-gray-100 rounded-xl text-gray-500">◀</button>
            <button onclick="openDatePickerModal()" class="font-extrabold text-lg text-gray-800 hover:text-teal-600 flex items-center gap-1">
              <span id="currentMonthStr">2026년 9월</span>
              <span class="text-xs text-gray-400">▼</span>
            </button>
            <button onclick="changeMonth(1)" class="p-2 hover:bg-gray-100 rounded-xl text-gray-500">▶</button>
          </div>

          <div class="grid grid-cols-2 gap-3 pt-2 border-t border-gray-100">
            <div class="bg-red-50/60 p-3 rounded-xl border border-red-100/50">
              <span class="text-[11px] text-red-500 font-bold block">이번 달 지출</span>
              <span id="monthExpense" class="text-base font-black text-red-600 truncate block mt-0.5">-0원</span>
            </div>
            <div class="bg-blue-50/60 p-3 rounded-xl border border-blue-100/50">
              <span class="text-[11px] text-blue-500 font-bold block">이번 달 수입</span>
              <span id="monthIncome" class="text-base font-black text-blue-600 truncate block mt-0.5">+0원</span>
            </div>
          </div>
        </div>

        <!-- 달력 그리드 -->
        <div class="bg-white p-4 rounded-2xl border border-gray-100 shadow-sm">
          <div class="grid grid-cols-7 text-center text-xs font-bold text-gray-400 mb-2">
            <div class="text-red-400">일</div>
            <div>월</div>
            <div>화</div>
            <div>수</div>
            <div>목</div>
            <div>금</div>
            <div class="text-blue-400">토</div>
          </div>
          <div id="calendarDays" class="grid grid-cols-7 text-center gap-y-1">
            <!-- JavaScript에서 날짜 자동 생성을 수행합니다 -->
          </div>
        </div>

        <!-- 선택 일자 내역 리스트 -->
        <div class="space-y-2">
          <div class="flex justify-between items-center px-1">
            <span id="selectedDateText" class="font-extrabold text-sm text-gray-700">내역</span>
            <span id="dayTotalAmount" class="font-bold text-xs text-gray-500">-0원</span>
          </div>
          <ul id="expenseList" class="space-y-2">
            <!-- JavaScript에서 선택 날짜 내역을 생성합니다 -->
          </ul>
        </div>
      </section>

      <!-- STEP 2: 사용자 선택 -->
      <section id="step2" class="hidden space-y-4">
        <h2 class="text-lg font-bold text-gray-800">1. 작성자 선택</h2>
        <div id="userGrid" class="grid grid-cols-2 gap-3"></div>
      </section>

      <!-- STEP 3: 수입/지출 선택 -->
      <section id="step3" class="hidden space-y-4">
        <h2 class="text-lg font-bold text-gray-800">2. 구분을 선택해주세요</h2>
        <div class="grid grid-cols-2 gap-4 pt-4">
          <button onclick="selectType('지출')" class="p-6 bg-white border-2 border-red-200 rounded-2xl flex flex-col items-center gap-2 active:bg-red-50 shadow-sm">
            <span class="text-4xl">💸</span>
            <span class="font-bold text-red-600">지출</span>
          </button>
          <button onclick="selectType('수입')" class="p-6 bg-white border-2 border-blue-200 rounded-2xl flex flex-col items-center gap-2 active:bg-blue-50 shadow-sm">
            <span class="text-4xl">💰</span>
            <span class="font-bold text-blue-600">수입</span>
          </button>
        </div>
      </section>

      <!-- STEP 4: 금액 입력 -->
      <section id="step4" class="hidden space-y-4">
        <h2 class="text-lg font-bold text-gray-800">3. 금액을 입력해주세요</h2>
        <div class="bg-white p-4 rounded-2xl border border-gray-200 shadow-sm space-y-3">
          <input type="number" id="inputAmount" placeholder="0" class="w-full text-right text-3xl font-black p-2 border-b-2 border-teal-500 focus:outline-none" autofocus />
          <button onclick="submitAmount()" class="w-full py-3 bg-teal-500 hover:bg-teal-600 text-white font-bold rounded-xl shadow-md transition">
            다음
          </button>
        </div>
      </section>

      <!-- STEP 5: 카테고리 및 적요 입력 -->
      <section id="step5" class="hidden space-y-4">
        <h2 class="text-lg font-bold text-gray-800">4. 카테고리 & 메모</h2>
        <input type="text" id="inputMemo" placeholder="내역 메모 입력 (선택)" class="w-full p-3 bg-white border rounded-xl text-sm focus:outline-none focus:border-teal-500 shadow-sm" />
        <div id="categoryGrid" class="grid grid-cols-3 gap-3"></div>
      </section>

      <!-- STEP 6: 결제수단 선택 -->
      <section id="step6" class="hidden space-y-4">
        <h2 class="text-lg font-bold text-gray-800">5. 결제 수단 선택</h2>
        <div id="paymentGrid" class="grid grid-cols-1 gap-3"></div>
      </section>

      <!-- STEP 7: 검색 화면 -->
      <section id="step7" class="hidden space-y-4">
        <h2 class="text-lg font-bold text-gray-800">내역 검색</h2>
        <div class="flex gap-2">
          <input type="text" id="searchInput" oninput="handleSearch()" placeholder="메모, 카테고리, 결제수단 검색..." class="flex-1 p-3 bg-white border rounded-xl text-sm focus:outline-none focus:border-teal-500 shadow-sm" />
        </div>
        <ul id="searchResults" class="space-y-2"></ul>
      </section>

    </main>

    <!-- BOTTOM NAVIGATION / ACTION BAR -->
    <footer class="bg-white border-t border-gray-200 p-4 flex justify-around items-center sticky bottom-0 z-10">
      <button onclick="goToStep(1)" class="flex flex-col items-center text-gray-500 hover:text-teal-600">
        <span class="text-xl">📅</span>
        <span class="text-[10px] font-bold mt-0.5">달력</span>
      </button>
      <button onclick="startAddProcess()" class="bg-teal-500 hover:bg-teal-600 text-white font-bold p-3.5 rounded-full shadow-lg transform -translate-y-2 active:scale-95 transition">
        <span class="text-xl leading-none">+</span>
      </button>
      <button onclick="goToStep(7)" class="flex flex-col items-center text-gray-500 hover:text-teal-600">
        <span class="text-xl">🔍</span>
        <span class="text-[10px] font-bold mt-0.5">검색</span>
      </button>
    </footer>

  </div>

  <!-- MODAL: 연/월 선택 모달 -->
  <div id="datePickerModal" class="fixed inset-0 bg-black/50 backdrop-blur-sm hidden flex items-center justify-center p-4 z-50">
    <div class="bg-white rounded-3xl p-5 w-full max-w-xs space-y-4 shadow-xl">
      <h3 class="font-bold text-gray-800 text-center">조회 연월 선택</h3>
      <select id="selectYear" class="w-full p-2 bg-gray-50 border rounded-xl font-bold text-center text-gray-700"></select>
      <div id="monthGrid" class="grid grid-cols-4 gap-2"></div>
      <div class="flex gap-2 pt-2">
        <button onclick="closeDatePickerModal()" class="flex-1 py-2.5 bg-gray-100 text-gray-600 rounded-xl font-bold text-xs">취소</button>
        <button onclick="confirmDatePick()" class="flex-1 py-2.5 bg-teal-500 text-white rounded-xl font-bold text-xs shadow-md">확인</button>
      </div>
    </div>
  </div>

  <!-- MODAL: 항목 추가 모달 (사용자, 카테고리, 결제수단 추가) -->
  <div id="addItemModal" class="fixed inset-0 bg-black/50 backdrop-blur-sm hidden flex items-center justify-center p-4 z-50">
    <div class="bg-white rounded-3xl p-5 w-full max-w-xs space-y-4 shadow-xl">
      <h3 id="modalTitle" class="font-bold text-gray-800 text-center">항목 추가</h3>
      <input type="text" id="modalInputName" placeholder="이름 입력" class="w-full p-3 border rounded-xl text-sm focus:outline-none focus:border-teal-500" />
      <div>
        <label class="text-xs font-bold text-gray-400 block mb-2">아이콘 선택</label>
        <div id="iconPickerGrid" class="grid grid-cols-5 gap-2 max-h-32 overflow-y-auto no-scrollbar p-1 border rounded-xl"></div>
      </div>
      <div class="flex gap-2 pt-2">
        <button onclick="closeModal()" class="flex-1 py-2.5 bg-gray-100 text-gray-600 rounded-xl font-bold text-xs">취소</button>
        <button onclick="confirmAddItem()" class="flex-1 py-2.5 bg-teal-500 text-white rounded-xl font-bold text-xs shadow-md">저장</button>
      </div>
    </div>
  </div>

  <!-- JAVASCRIPT LOGIC -->
  <script>
    /* 기본 데이터 및 상태 정의 */
    const defaultUsers = [
      { name: '아빠', icon: '👨' },
      { name: '엄마', icon: '👩' }
    ];

    const defaultCategories = [
      { name: '식비', icon: '🍚' },
      { name: '교통', icon: '🚌' },
      { name: '쇼핑', icon: '🛍️' },
      { name: '주거/통신', icon: '🏠' },
      { name: '취미/문화', icon: '🎬' },
      { name: '기타', icon: '📌' }
    ];

    const defaultPayments = [
      { name: '신용카드', icon: '💳' },
      { name: '체크카드', icon: '💳' },
      { name: '현금', icon: '💵' },
      { name: '계좌이체', icon: '🏦' }
    ];

    const iconPresets = {
      user: ['👨', '👩', '👦', '👧', '👶', '👤', '🐶', '🐱'],
      category: ['🍚', '☕', '🚌', '🛍️', '🏠', '🎬', '💊', '🎁', '✈️', '📌', '💡', '🚗'],
      payment: ['💳', '💵', '🏦', '📱', '🪙']
    };

    let users = JSON.parse(localStorage.getItem('my_users')) || defaultUsers;
    let categories = JSON.parse(localStorage.getItem('my_categories')) || defaultCategories;
    let payments = JSON.parse(localStorage.getItem('my_payments')) || defaultPayments;
    let expenses = JSON.parse(localStorage.getItem('my_expenses')) || [];

    let currentDate = new Date();
    let selectedDateStr = new Date().toISOString().split('T')[0];
    let selectedModalMonth = currentDate.getMonth();

    let modalTargetType = '';
    let selectedIcon = '';

    let form = {
      user: '',
      type: '지출',
      amount: 0,
      memo: '',
      category: '',
      payment: ''
    };

    /* 초기화 */
    document.addEventListener('DOMContentLoaded', () => {
      renderCalendar();
      renderDayExpenses();
    });

    /* 스텝 제어 */
    function goToStep(step) {
      for (let i = 1; i <= 7; i++) {
        const el = document.getElementById(`step${i}`);
        if (el) el.classList.add('hidden');
      }
      const target = document.getElementById(`step${step}`);
      if (target) target.classList.remove('hidden');

      if (step === 2) renderUsers();
      if (step === 5) renderCategories();
      if (step === 6) renderPayments();
    }

    function startAddProcess() {
      form = { user: '', type: '지출', amount: 0, memo: '', category: '', payment: '' };
      goToStep(2);
    }

    /* 검색 기능 */
    function handleSearch() {
      const query = document.getElementById('searchInput').value.trim().toLowerCase();
      const listEl = document.getElementById('searchResults');

      if (!query) {
        listEl.innerHTML = '';
        return;
      }

      const items = expenses.filter(i => 
        (i.memo && i.memo.toLowerCase().includes(query)) ||
        (i.category && i.category.toLowerCase().includes(query)) ||
        (i.payment && i.payment.toLowerCase().includes(query)) ||
        (i.user && i.user.toLowerCase().includes(query))
      );

      if (items.length === 0) {
        listEl.innerHTML = `<li class="text-center py-10 text-gray-400 text-xs bg-white rounded-2xl border">검색 결과가 없습니다.</li>`;
        return;
      }

      listEl.innerHTML = items.map(item => {
        const u = users.find(u => u.name === item.user) || { icon: '👤' };
        const c = categories.find(c => c.name === item.category) || { icon: '📌' };
        const isExpense = item.type === '지출';

        return `
          <li class="p-3 bg-white rounded-xl border flex justify-between items-center text-sm shadow-sm">
            <div class="flex items-center gap-3">
              <span class="text-2xl">${c.icon}</span>
              <div>
                <div class="font-bold text-gray-800 flex items-center gap-1">
                  <span>${item.memo}</span>
                  <span class="text-xs bg-gray-100 text-gray-500 px-1.5 py-0.5 rounded">${item.payment}</span>
                </div>
                <div class="text-xs text-gray-400 mt-0.5">${item.date} · ${u.icon} ${item.user}</div>
              </div>
            </div>
            <div class="text-right">
              <div class="font-bold ${isExpense ? 'text-gray-800' : 'text-blue-600'}">
                ${isExpense ? '-' : '+'}${item.amount.toLocaleString()}원
              </div>
            </div>
          </li>
        `;
      }).join('');
    }

    /* 연/월 선택 모달 함수 */
    function openDatePickerModal() {
      const currentYear = currentDate.getFullYear();
      selectedModalMonth = currentDate.getMonth();

      const yearSelect = document.getElementById('selectYear');
      yearSelect.innerHTML = '';
      
      for (let y = 2020; y <= 2030; y++) {
        const opt = document.createElement('option');
        opt.value = y;
        opt.innerText = `${y}년`;
        if (y === currentYear) opt.selected = true;
        yearSelect.appendChild(opt);
      }

      renderMonthPickerGrid();
      document.getElementById('datePickerModal').classList.remove('hidden');
    }

    function renderMonthPickerGrid() {
      const grid = document.getElementById('monthGrid');
      grid.innerHTML = Array.from({ length: 12 }, (_, i) => i).map(m => {
        const isSelected = m === selectedModalMonth;
        return `
          <button type="button" onclick="selectModalMonth(${m})" class="py-2 text-xs font-bold rounded-xl border transition ${isSelected ? 'bg-teal-500 text-white border-teal-500' : 'bg-gray-50 text-gray-700 hover:bg-gray-100'}">
            ${m + 1}월
          </button>
        `;
      }).join('');
    }

    function selectModalMonth(m) {
      selectedModalMonth = m;
      renderMonthPickerGrid();
    }

    function closeDatePickerModal() {
      document.getElementById('datePickerModal').classList.add('hidden');
    }

    function confirmDatePick() {
      const chosenYear = parseInt(document.getElementById('selectYear').value);
      currentDate.setFullYear(chosenYear);
      currentDate.setMonth(selectedModalMonth);

      selectedDateStr = `${chosenYear}-${String(selectedModalMonth + 1).padStart(2, '0')}-01`;

      renderCalendar();
      renderDayExpenses();
      closeDatePickerModal();
    }

    /* 사용자 목록 렌더링 */
    function renderUsers() {
      const grid = document.getElementById('userGrid');
      grid.innerHTML = users.map((u, idx) => `
        <div class="relative group">
          <button onclick="deleteUser(${idx}, event)" class="absolute -top-1.5 -right-1.5 bg-red-400 text-white rounded-full w-5 h-5 text-xs font-bold flex items-center justify-center shadow">✕</button>
          <button onclick="selectUser('${u.name}')" class="w-full p-4 bg-white border rounded-2xl flex flex-col items-center justify-center gap-2 active:bg-gray-100 shadow-sm">
            <span class="text-3xl">${u.icon}</span>
            <span class="font-bold text-sm text-gray-700">${u.name}</span>
          </button>
        </div>
      `).join('') + `
        <button onclick="openModal('user')" class="p-4 bg-gray-100 border-2 border-dashed border-gray-300 rounded-2xl flex flex-col items-center justify-center gap-1 active:bg-gray-200">
          <span class="text-2xl text-gray-400">+</span>
          <span class="text-xs font-bold text-gray-500">추가</span>
        </button>
      `;
    }

    function deleteUser(index, event) {
      event.stopPropagation();
      if (confirm(`'${users[index].name}' 사용자를 삭제하시겠습니까?`)) {
        users.splice(index, 1);
        localStorage.setItem('my_users', JSON.stringify(users));
        renderUsers();
      }
    }

    function selectUser(name) { form.user = name; goToStep(3); }
    function selectType(type) { form.type = type; goToStep(4); }

    function submitAmount() {
      const amt = parseInt(document.getElementById('inputAmount').value);
      if (!amt || amt <= 0) return alert("금액을 정확히 입력해주세요.");
      form.amount = amt;
      goToStep(5);
    }

    /* 카테고리 목록 렌더링 */
    function renderCategories() {
      const grid = document.getElementById('categoryGrid');
      grid.innerHTML = categories.map((c, idx) => `
        <div class="relative group">
          <button onclick="deleteCategory(${idx}, event)" class="absolute -top-1.5 -right-1.5 bg-red-400 text-white rounded-full w-5 h-5 text-xs font-bold flex items-center justify-center shadow">✕</button>
          <button onclick="selectCategory('${c.name}')" class="w-full p-3 bg-white border rounded-2xl flex flex-col items-center gap-1 active:bg-gray-100 shadow-sm">
            <span class="text-2xl">${c.icon}</span>
            <span class="text-xs font-bold text-gray-700">${c.name}</span>
          </button>
        </div>
      `).join('') + `
        <button onclick="openModal('category')" class="p-3 bg-gray-100 border-2 border-dashed border-gray-300 rounded-2xl flex flex-col items-center justify-center gap-1">
          <span class="text-xl text-gray-400">+</span>
          <span class="text-xs font-bold text-gray-500">추가</span>
        </button>
      `;
    }

    function deleteCategory(index, event) {
      event.stopPropagation();
      if (confirm(`'${categories[index].name}' 카테고리를 삭제하시겠습니까?`)) {
        categories.splice(index, 1);
        localStorage.setItem('my_categories', JSON.stringify(categories));
        renderCategories();
      }
    }

    function selectCategory(cat) {
      form.memo = document.getElementById('inputMemo').value || cat;
      form.category = cat;
      goToStep(6);
    }

    /* 결제수단 목록 렌더링 */
    function renderPayments() {
      const grid = document.getElementById('paymentGrid');
      grid.innerHTML = payments.map((p, idx) => `
        <div class="relative group">
          <button onclick="deletePayment(${idx}, event)" class="absolute -top-1.5 -right-1.5 bg-red-400 text-white rounded-full w-5 h-5 text-xs font-bold flex items-center justify-center shadow">✕</button>
          <button onclick="saveExpense('${p.name}')" class="w-full p-5 bg-white border rounded-2xl flex items-center justify-center gap-3 active:bg-gray-100 shadow-sm">
            <span class="text-2xl">${p.icon}</span>
            <span class="font-bold text-sm text-gray-700">${p.name}</span>
          </button>
        </div>
      `).join('') + `
        <button onclick="openModal('payment')" class="p-5 bg-gray-100 border-2 border-dashed border-gray-300 rounded-2xl flex items-center justify-center gap-2">
          <span class="text-xl text-gray-400">+</span>
          <span class="text-sm font-bold text-gray-500">추가</span>
        </button>
      `;
    }

    function deletePayment(index, event) {
      event.stopPropagation();
      if (confirm(`'${payments[index].name}' 결제수단을 삭제하시겠습니까?`)) {
        payments.splice(index, 1);
        localStorage.setItem('my_payments', JSON.stringify(payments));
        renderPayments();
      }
    }

    function openModal(type) {
      modalTargetType = type;
      const modal = document.getElementById('addItemModal');
      const title = document.getElementById('modalTitle');
      const input = document.getElementById('modalInputName');
      const iconGrid = document.getElementById('iconPickerGrid');

      input.value = '';
      if (type === 'user') title.innerText = '사용자 추가';
      if (type === 'category') title.innerText = '카테고리 추가';
      if (type === 'payment') title.innerText = '결제수단 추가';

      const icons = iconPresets[type] || iconPresets.category;
      selectedIcon = icons[0];

      iconGrid.innerHTML = icons.map((icon, index) => `
        <button type="button" onclick="pickIcon('${icon}', this)" class="icon-btn p-2 text-xl rounded-lg text-center hover:bg-gray-200 ${index === 0 ? 'bg-teal-100 border border-teal-500' : ''}">
          ${icon}
        </button>
      `).join('');

      modal.classList.remove('hidden');
    }

    function pickIcon(icon, btn) {
      selectedIcon = icon;
      document.querySelectorAll('.icon-btn').forEach(b => b.classList.remove('bg-teal-100', 'border', 'border-teal-500'));
      btn.classList.add('bg-teal-100', 'border', 'border-teal-500');
    }

    function closeModal() {
      document.getElementById('addItemModal').classList.add('hidden');
    }

    function confirmAddItem() {
      const name = document.getElementById('modalInputName').value.trim();
      if (!name) return alert('이름을 입력해주세요.');

      if (modalTargetType === 'user') {
        users.push({ name, icon: selectedIcon });
        localStorage.setItem('my_users', JSON.stringify(users));
        renderUsers();
      } else if (modalTargetType === 'category') {
        categories.push({ name, icon: selectedIcon });
        localStorage.setItem('my_categories', JSON.stringify(categories));
        renderCategories();
      } else if (modalTargetType === 'payment') {
        payments.push({ name, icon: selectedIcon });
        localStorage.setItem('my_payments', JSON.stringify(payments));
        renderPayments();
      }

      closeModal();
    }

    function saveExpense(payment) {
      form.payment = payment;
      const newItem = {
        id: Date.now().toString(),
        date: selectedDateStr,
        ...form
      };

      expenses.push(newItem);
      localStorage.setItem('my_expenses', JSON.stringify(expenses));

      document.getElementById('inputAmount').value = '';
      document.getElementById('inputMemo').value = '';

      renderCalendar();
      renderDayExpenses();
      goToStep(1);
    }

    function changeMonth(delta) {
      currentDate.setMonth(currentDate.getMonth() + delta);
      renderCalendar();
    }

    function renderCalendar() {
      const year = currentDate.getFullYear();
      const month = currentDate.getMonth();
      document.getElementById('currentMonthStr').innerText = `${year}년 ${month + 1}월`;

      const firstDay = new Date(year, month, 1).getDay();
      const lastDate = new Date(year, month + 1, 0).getDate();
      const calendarDays = document.getElementById('calendarDays');
      calendarDays.innerHTML = '';

      for (let i = 0; i < firstDay; i++) calendarDays.innerHTML += `<div></div>`;

      let monthExpenseSum = 0;
      let monthIncomeSum = 0;

      for (let day = 1; day <= lastDate; day++) {
        const dateString = `${year}-${String(month + 1).padStart(2, '0')}-${String(day).padStart(2, '0')}`;
        const dayItems = expenses.filter(item => item.date === dateString);
        
        const dayExpense = dayItems.filter(i => i.type === '지출').reduce((a, b) => a + b.amount, 0);
        const dayIncome = dayItems.filter(i => i.type === '수입').reduce((a, b) => a + b.amount, 0);

        monthExpenseSum += dayExpense;
        monthIncomeSum += dayIncome;

        const isSelected = dateString === selectedDateStr;
        const dayClass = isSelected ? 'bg-teal-500 text-white font-bold rounded-full' : '';

        calendarDays.innerHTML += `
          <div onclick="selectDate('${dateString}')" class="p-1 flex flex-col items-center justify-center h-12 cursor-pointer">
            <span class="w-7 h-7 flex items-center justify-center text-xs ${dayClass}">${day}</span>
            <span class="text-[9px] text-red-500 font-medium truncate w-full ${dayExpense ? '' : 'hidden'}">
              -${(dayExpense/10000).toFixed(0) > 0 ? (dayExpense/10000).toFixed(0) + '만' : dayExpense.toLocaleString()}
            </span>
          </div>
        `;
      }

      document.getElementById('monthExpense').innerText = `-${monthExpenseSum.toLocaleString()}원`;
      document.getElementById('monthIncome').innerText = `+${monthIncomeSum.toLocaleString()}원`;
    }

    function selectDate(dateStr) {
      selectedDateStr = dateStr;
      renderCalendar();
      renderDayExpenses();
    }

    function renderDayExpenses() {
      const [y, m, d] = selectedDateStr.split('-');
      document.getElementById('selectedDateText').innerText = `${parseInt(m)}월 ${parseInt(d)}일 내역`;

      const listEl = document.getElementById('expenseList');
      const dayItems = expenses.filter(item => item.date === selectedDateStr);
      const dayTotal = dayItems.filter(i => i.type === '지출').reduce((sum, item) => sum + item.amount, 0);

      document.getElementById('dayTotalAmount').innerText = `-${dayTotal.toLocaleString()}원`;

      if (dayItems.length === 0) {
        listEl.innerHTML = `<li class="text-center py-6 text-gray-400 text-xs">기록된 내역이 없습니다.</li>`;
        return;
      }

      listEl.innerHTML = dayItems.map(item => {
        const u = users.find(u => u.name === item.user) || { icon: '👤' };
        const c = categories.find(c => c.name === item.category) || { icon: '📌' };
        const isExpense = item.type === '지출';

        return `
          <li class="p-3 bg-white rounded-xl border flex justify-between items-center text-sm shadow-sm">
            <div class="flex items-center gap-3">
              <span class="text-2xl">${c.icon}</span>
              <div>
                <div class="font-bold text-gray-800 flex items-center gap-1">
                  <span>${item.memo}</span>
                  <span class="text-xs bg-gray-100 text-gray-500 px-1.5 py-0.5 rounded">${item.payment}</span>
                </div>
                <div class="text-xs text-gray-400 mt-0.5">${u.icon} ${item.user} · ${item.category}</div>
              </div>
            </div>
            <div class="text-right">
              <div class="font-bold ${isExpense ? 'text-gray-800' : 'text-blue-600'}">
                ${isExpense ? '-' : '+'}${item.amount.toLocaleString()}원
              </div>
              <button onclick="deleteExpense('${item.id}')" class="text-[10px] text-gray-300 hover:text-red-400">삭제</button>
            </div>
          </li>
        `;
      }).join('');
    }

    function deleteExpense(id) {
      expenses = expenses.filter(item => item.id !== id);
      localStorage.setItem('my_expenses', JSON.stringify(expenses));
      renderCalendar();
      renderDayExpenses();
    }
  </script>
</body>
</html>
